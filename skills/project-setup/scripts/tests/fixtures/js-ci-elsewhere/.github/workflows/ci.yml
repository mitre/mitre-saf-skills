name: ci
on: [pull_request]
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - run: bash scripts/dep-gate.sh check "origin/${{ github.base_ref }}"
  vulns:
    runs-on: ubuntu-latest
    steps:
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc
        with:
          scan-args: --lockfile=pnpm-lock.yaml
